[project]
name = "skycast-ai"
version = "1.0.0"
description = "Skycast AI prediction module: statistical post-processing of NWP forecasts"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", ".cache", ".models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Query(...) defaults in signatures

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

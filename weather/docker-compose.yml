services:
  backend:
    build: ./backend
    environment:
      PORT: "8787"
      PROVIDER_MODE: "${PROVIDER_MODE:-auto}"
      CORS_ORIGIN: "http://localhost:8080"
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
